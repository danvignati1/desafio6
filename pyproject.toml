[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk==2.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aurora-restaurar = "aurora.restaurar:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
